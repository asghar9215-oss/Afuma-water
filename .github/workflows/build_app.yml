name: Build AFUMA Water App (Signed AAB, APK & PEM Key)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Create Web Project Structure & Files (Live Blogger Link)
        run: |
          mkdir -p www
          
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="ur" dir="rtl">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
              <title>AFUMA Water Bottle</title>
              <style>
                  body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #ffffff; }
                  iframe { width: 100%; height: 100%; border: none; outline: none; }
              </style>
          </head>
          <body>
              <iframe src="https://afumawater.blogspot.com" allow="geolocation; autoplay; camera"></iframe>
          </body>
          </html>
          EOF

          cat << 'EOF' > www/manifest.json
          {
            "name": "AFUMA Water Order",
            "short_name": "AFUMA",
            "start_url": "./index.html",
            "display": "standalone",
            "background_color": "#ffffff",
            "theme_color": "#00695c",
            "icons": [
              {
                "src": "https://i.ibb.co/wN2jHCF1/85c170a0-43a4-4e18-ba88-c6c39cdf8e3c-1-all-2044.jpg",
                "sizes": "512x512",
                "type": "image/jpeg"
              }
            ]
          }
          EOF

          cat << 'EOF' > www/sw.js
          self.addEventListener('install', (e) => {});
          self.addEventListener('fetch', (e) => { e.respondWith(fetch(e.request)); });
          EOF

          cat << 'EOF' > package.json
          {
            "name": "com.afumawater.orderapp",
            "version": "1.0.0",
            "dependencies": {
              "@capacitor/android": "^5.0.0",
              "@capacitor/core": "^5.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^5.0.0"
            }
          }
          EOF

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.afumawater.orderapp",
            "appName": "AFUMA Water",
            "webDir": "www",
            "server": {
              "url": "https://afumawater.blogspot.com",
              "cleartext": true
            }
          }
          EOF

      - name: Build Android Capacitor Project
        run: |
          npm install
          npx cap add android
          npx cap copy android

      - name: Download & Resize App Icon for Android
        run: |
          curl -sL "https://i.ibb.co/wN2jHCF1/85c170a0-43a4-4e18-ba88-c6c39cdf8e3c-1-all-2044.jpg" -o app_icon.jpg
          
          declare -A sizes=( ["mipmap-mdpi"]="48x48" ["mipmap-hdpi"]="72x72" ["mipmap-xhdpi"]="96x96" ["mipmap-xxhdpi"]="144x144" ["mipmap-xxxhdpi"]="192x192" )
          
          for dir in "${!sizes[@]}"; do
            target_dir="android/app/src/main/res/$dir"
            mkdir -p "$target_dir"
            convert app_icon.jpg -resize "${sizes[$dir]}" "$target_dir/ic_launcher.png"
            convert app_icon.jpg -resize "${sizes[$dir]}" "$target_dir/ic_launcher_round.png"
            convert app_icon.jpg -resize "${sizes[$dir]}" "$target_dir/ic_launcher_foreground.png"
          done

      - name: Inject Android GPS & Webview Permissions
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" \/>' $MANIFEST_PATH
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/>' $MANIFEST_PATH
          sed -i '/<\/manifest>/i \    <uses-feature android:name="android.hardware.location.gps" \/>' $MANIFEST_PATH

      - name: Generate KeyStore and PEM Certificate (App Key)
        run: |
          keytool -genkeypair -v -keystore afuma_key.jks -alias afuma -keyalg RSA -keysize 2048 -validity 10000 -storepass afumapass123 -keypass afumapass123 -dname "CN=AFUMA, OU=Water, O=AfumaWater, L=Karachi, S=Sindh, C=PK"
          keytool -exportcert -rfc -keystore afuma_key.jks -alias afuma -storepass afumapass123 -file afuma_cert.pem
          mkdir -p keys_output
          cp afuma_key.jks keys_output/
          cp afuma_cert.pem keys_output/

      - name: Build Release AAB (Play Console)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Sign Release AAB File
        run: |
          jarsigner -keystore afuma_key.jks -storepass afumapass123 -keypass afumapass123 android/app/build/outputs/bundle/release/app-release.aab afuma

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload Signed AAB Artifact (For Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: AFUMA-Water-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AFUMA-Water-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload PEM & Keystore Key Files
        uses: actions/upload-artifact@v4
        with:
          name: AFUMA-Water-PEM-KEY
          path: keys_output/
